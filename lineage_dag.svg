<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Airbnb dbt project data lineage DAG</title>
  <desc>Data flow from raw Airbnb sources through staging, dimension/fact, and mart layers to an executive dashboard</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .label { font-size: 11px; fill: #444; }
      .header { font-size: 11px; fill: #888; }
      /* Source - teal */
      .src rect { fill: #d0f0e8; stroke: #0f6e56; stroke-width: 0.5; }
      .src text { fill: #085041; font-size: 11px; font-weight: 600; }
      /* Staging / Snapshots - purple */
      .stg rect { fill: #e4e2fb; stroke: #534ab7; stroke-width: 0.5; }
      .stg text { fill: #3c3489; font-size: 11px; font-weight: 600; }
      /* Dims / Facts - blue */
      .dim rect { fill: #d4e9f9; stroke: #185fa5; stroke-width: 0.5; }
      .dim text { fill: #0c447c; font-size: 11px; font-weight: 600; }
      /* Marts - amber */
      .mart rect { fill: #fce9c0; stroke: #ba7517; stroke-width: 0.5; }
      .mart text { fill: #854f0b; font-size: 11px; font-weight: 600; }
      /* Seeds / Tests - gray */
      .seed rect { fill: #eceae3; stroke: #5f5e5a; stroke-width: 0.5; }
      .seed text { fill: #444441; font-size: 11px; font-weight: 600; }
      /* Output - coral */
      .out rect { fill: #f8d8ce; stroke: #993c1d; stroke-width: 0.5; }
      .out text { fill: #712b13; font-size: 11px; font-weight: 600; }
      /* Legend swatches */
      .leg-teal   { fill: #d0f0e8; stroke: #0f6e56; stroke-width: 0.5; }
      .leg-purple { fill: #e4e2fb; stroke: #534ab7; stroke-width: 0.5; }
      .leg-blue   { fill: #d4e9f9; stroke: #185fa5; stroke-width: 0.5; }
      .leg-amber  { fill: #fce9c0; stroke: #ba7517; stroke-width: 0.5; }
      .leg-gray   { fill: #eceae3; stroke: #5f5e5a; stroke-width: 0.5; }
      .leg-coral  { fill: #f8d8ce; stroke: #993c1d; stroke-width: 0.5; }
      line, path.edge { stroke: #aaa; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Column headers -->
  <text class="header" x="52"  y="22" text-anchor="middle">Sources</text>
  <text class="header" x="196" y="22" text-anchor="middle">Staging</text>
  <text class="header" x="342" y="22" text-anchor="middle">Dims / Facts</text>
  <text class="header" x="494" y="22" text-anchor="middle">Marts / Tests</text>
  <text class="header" x="628" y="22" text-anchor="middle">Output</text>

  <!-- ── Source nodes ── -->
  <g class="src">
    <rect x="6"  y="40"  width="92" height="32" rx="6"/>
    <text x="52"  y="57"  text-anchor="middle">airbnb.hosts</text>
  </g>
  <g class="src">
    <rect x="6"  y="160" width="92" height="32" rx="6"/>
    <text x="52"  y="177" text-anchor="middle">airbnb.listings</text>
  </g>
  <g class="src">
    <rect x="6"  y="270" width="92" height="32" rx="6"/>
    <text x="52"  y="287" text-anchor="middle">airbnb.reviews</text>
  </g>
  <g class="seed">
    <rect x="6"  y="345" width="92" height="32" rx="6"/>
    <text x="52"  y="358" text-anchor="middle" font-size="10">full_moon</text>
    <text x="52"  y="370" text-anchor="middle" font-size="10">_no_sleep</text>
  </g>

  <!-- ── Staging nodes ── -->
  <g class="stg">
    <rect x="150" y="40"  width="92" height="32" rx="6"/>
    <text x="196" y="51"  text-anchor="middle" font-size="10">scd_raw</text>
    <text x="196" y="64"  text-anchor="middle" font-size="10">_hosts</text>
  </g>
  <g class="stg">
    <rect x="150" y="95"  width="92" height="32" rx="6"/>
    <text x="196" y="112" text-anchor="middle">src_hosts</text>
  </g>
  <g class="stg">
    <rect x="150" y="150" width="92" height="32" rx="6"/>
    <text x="196" y="161" text-anchor="middle" font-size="10">scd_raw</text>
    <text x="196" y="174" text-anchor="middle" font-size="10">_listings</text>
  </g>
  <g class="stg">
    <rect x="150" y="205" width="92" height="32" rx="6"/>
    <text x="196" y="222" text-anchor="middle">src_listings</text>
  </g>
  <g class="stg">
    <rect x="150" y="270" width="92" height="32" rx="6"/>
    <text x="196" y="287" text-anchor="middle">src_reviews</text>
  </g>

  <!-- ── Dim / Fact nodes ── -->
  <g class="dim">
    <rect x="296" y="95"  width="92" height="32" rx="6"/>
    <text x="342" y="106" text-anchor="middle" font-size="10">dim_hosts</text>
    <text x="342" y="119" text-anchor="middle" font-size="10">_cleansed</text>
  </g>
  <g class="dim">
    <rect x="296" y="205" width="92" height="32" rx="6"/>
    <text x="342" y="216" text-anchor="middle" font-size="10">dim_listings</text>
    <text x="342" y="229" text-anchor="middle" font-size="10">_cleansed</text>
  </g>
  <g class="dim">
    <rect x="296" y="270" width="92" height="32" rx="6"/>
    <text x="342" y="287" text-anchor="middle">fct_reviews</text>
  </g>
  <g class="seed">
    <rect x="296" y="345" width="92" height="32" rx="6"/>
    <text x="342" y="356" text-anchor="middle" font-size="10">seed_full</text>
    <text x="342" y="369" text-anchor="middle" font-size="10">_moon_dates</text>
  </g>

  <!-- ── Mart / Test nodes ── -->
  <g class="mart">
    <rect x="444" y="150" width="100" height="32" rx="6"/>
    <text x="494" y="161" text-anchor="middle" font-size="10">dim_listings</text>
    <text x="494" y="174" text-anchor="middle" font-size="10">_w_hosts</text>
  </g>
  <g class="seed">
    <rect x="444" y="205" width="100" height="32" rx="6"/>
    <text x="494" y="216" text-anchor="middle" font-size="9">dim_listings</text>
    <text x="494" y="229" text-anchor="middle" font-size="9">_minimum_nights</text>
  </g>
  <g class="seed">
    <rect x="444" y="255" width="100" height="32" rx="6"/>
    <text x="494" y="266" text-anchor="middle" font-size="10">consistent</text>
    <text x="494" y="279" text-anchor="middle" font-size="10">_created_at</text>
  </g>
  <g class="mart">
    <rect x="444" y="315" width="100" height="32" rx="6"/>
    <text x="494" y="326" text-anchor="middle" font-size="10">mart_fullmoon</text>
    <text x="494" y="339" text-anchor="middle" font-size="10">_reviews</text>
  </g>

  <!-- ── Output node ── -->
  <g class="out">
    <rect x="582" y="195" width="92" height="32" rx="6"/>
    <text x="628" y="206" text-anchor="middle" font-size="11">Executive</text>
    <text x="628" y="219" text-anchor="middle" font-size="11">Dashboard</text>
  </g>

  <!-- ══ Edges ══ -->
  <line x1="98"  y1="52"  x2="150" y2="52"  marker-end="url(#arrow)"/>
  <path class="edge" d="M98 60 Q124 60 124 111 L150 111" marker-end="url(#arrow)"/>
  <path class="edge" d="M98 170 Q124 170 124 162 L150 162" marker-end="url(#arrow)"/>
  <line x1="98"  y1="178" x2="150" y2="221" marker-end="url(#arrow)"/>
  <line x1="98"  y1="286" x2="150" y2="286" marker-end="url(#arrow)"/>
  <line x1="98"  y1="361" x2="296" y2="361" marker-end="url(#arrow)"/>

  <line x1="242" y1="111" x2="296" y2="111" marker-end="url(#arrow)"/>
  <line x1="242" y1="221" x2="296" y2="221" marker-end="url(#arrow)"/>
  <line x1="242" y1="286" x2="296" y2="286" marker-end="url(#arrow)"/>

  <path class="edge" d="M388 111 Q416 111 416 162 L444 162" marker-end="url(#arrow)"/>
  <path class="edge" d="M388 221 Q416 221 416 170 L444 170" marker-end="url(#arrow)"/>
  <line x1="388" y1="228" x2="444" y2="228"  marker-end="url(#arrow)"/>
  <path class="edge" d="M388 278 Q416 278 416 268 L444 268" marker-end="url(#arrow)"/>
  <path class="edge" d="M388 290 Q416 290 416 328 L444 328" marker-end="url(#arrow)"/>
  <path class="edge" d="M388 361 Q416 361 416 340 L444 340" marker-end="url(#arrow)"/>

  <path class="edge" d="M544 166 Q560 166 560 211 L582 211" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect class="leg-teal"   x="8"   y="388" width="10" height="10" rx="2"/>
  <text class="label" x="22"  y="397">Sources</text>
  <rect class="leg-purple" x="78"  y="388" width="10" height="10" rx="2"/>
  <text class="label" x="92"  y="397">Staging / Snapshots</text>
  <rect class="leg-blue"   x="205" y="388" width="10" height="10" rx="2"/>
  <text class="label" x="219" y="397">Dims / Facts</text>
  <rect class="leg-amber"  x="295" y="388" width="10" height="10" rx="2"/>
  <text class="label" x="309" y="397">Marts</text>
  <rect class="leg-gray"   x="348" y="388" width="10" height="10" rx="2"/>
  <text class="label" x="362" y="397">Seeds / Tests</text>
  <rect class="leg-coral"  x="440" y="388" width="10" height="10" rx="2"/>
  <text class="label" x="454" y="397">Output</text>
</svg>
